name: Build Poco F3 GT Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Dynamic Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev libelf-dev bison flex git ccache python3

      - name: Dynamic Kernel Construction
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out ares_defconfig
          make O=out -j$(nproc --all)

      - name: Package Network Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Poco-F3-GT-NetHunter-Kernel
          path: out/arch/arm64/boot/Image.gz-dtb

